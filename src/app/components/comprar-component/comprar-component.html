<div class="container mx-auto mt-6 px-4">
    <div class="border border-cyan-500 border-4 mx-auto w-full max-w-lg flex flex-col p-6 rounded-lg shadow-lg bg-white">
        <h1 class="text-center text-blue-600 text-3xl font-medium mb-6">Cubo</h1>
        <form action="" class="flex flex-col gap-4">
            <select name="selectcubo" #selectcubo id=""
                class="w-full border border-gray-300 rounded-md p-2.5 bg-white text-gray-700 focus:outline-none focus:ring-1 focus:ring-cyan-500 text-sm cursor-pointer">
                @for (cubo of cubos; track cubo) {
                    <option value="{{cubo.idCubo}}">{{cubo.nombre}}</option>
                }
            </select>
            <button (click)="comprar()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-md transition-colors text-sm shadow-sm w-full">Comprar cubo</button>
        </form>
    </div>
</div>
