<div class="container mx-auto mt-6 px-4">
    <div class="border border-gray-200 mx-auto w-full max-w-3xl flex flex-col p-6 rounded-lg shadow-sm bg-white">
        <h1 class="text-center text-blue-600 text-3xl font-medium mb-6">Iniciar Sesión</h1>
        <form #formLogin="ngForm" action="" class="flex flex-col gap-3">
            <label for="" class="block text-sm text-gray-700">Email</label>
            <input name="cajanombre" #cajanombre type="text" placeholder="Ingresa tu email" class="w-full border border-gray-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
            
            <label for="" class="block text-sm text-gray-700 mt-2">Contraseña</label>
            <input name="cajacontraseia" #cajacontrasenia type="password" placeholder="Ingresa tu contraseña" class="w-full border border-gray-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm">
            
            <button (click)="login()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-md mt-4 transition-colors flex items-center justify-center gap-2 w-max text-sm">
                <span>→</span> Iniciar Sesión
            </button>
        </form>
    </div>
</div>
